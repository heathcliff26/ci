
---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for do-not-merge
        id: do-not-merge
        uses: docker://agilepathway/pull-request-label-checker:v1.6.115
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge
