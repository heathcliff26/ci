---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        uses: agilepathway/label-checker@v2.0.58
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge,hold
