---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        uses: agilepathway/label-checker@68dd5b44cb692363bca246a60840bed28b901f18 # v2.0.87
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge,hold
