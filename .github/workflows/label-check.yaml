---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        uses: agilepathway/label-checker@ea2071efa384ff922030701e6b402251861a68e1 # v2.0.81
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge,hold
