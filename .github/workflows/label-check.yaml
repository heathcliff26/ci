---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        uses: agilepathway/label-checker@a06bc6264ca6d301383d56f7f6835c36fda48d05 # v2.0.85
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge,hold
