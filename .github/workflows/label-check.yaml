---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        uses: agilepathway/label-checker@18a4910df085c928716d17d5251e61b8b28f980f # v2.0.90
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge,hold
