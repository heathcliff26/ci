---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        uses: agilepathway/label-checker@be9ec6c3cf7422877c41630a194d1d801371d8d3 # v2.0.78
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge,hold
