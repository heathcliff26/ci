---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        uses: agilepathway/label-checker@6bc695331a4a7cef5ddc5467dd266baafd3751b8 # v2.0.86
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge,hold
