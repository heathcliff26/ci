---
name: "Labels Check"

on:
  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check labels
        uses: agilepathway/label-checker@7e36291d6bfe1ddb6cbc8cd5081d2eb85ba1f7c6 # v2.0.75
        with:
          repo_token: ${{ github.token }}
          none_of: do-not-merge,hold
