---
name: "Build Containers for multiple"

on:
  workflow_call:
    inputs:
      images:
        description: >-
          One image per line, values are comma-separated key=value pairs.
          Required:
            name: Name of the image
            tags: List of tags for the image
          Optional:
            context: Path to the build context, defaults to "."
            containerfile: Path to the containerfile, defaults to podmans defaults
            buildargs: List of key=value pairs of build args
        type: string
        required: true
      dry-run:
        description: "Build locally without pushing or signing"
        type: boolean
        default: false
        required: false
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_TOKEN:
        required: false
      QUAY_USERNAME:
        required: false
      QUAY_TOKEN:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_USERNAME: "${{ github.repository_owner }}"
      DOCKER_USERNAME: "${{ secrets.DOCKER_USERNAME }}"
      QUAY_USERNAME: "${{ secrets.QUAY_USERNAME }}"
      COSIGN_PRIVATE_KEY: "${{ secrets.COSIGN_PRIVATE_KEY }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ ! inputs.dry-run }}
        with:
          registry: ghcr.io
          username: "${{ env.GITHUB_USERNAME }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log in to the Dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ ! inputs.dry-run && env.DOCKER_USERNAME != '' }}
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_TOKEN }}"

      - name: Log in to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ ! inputs.dry-run && env.QUAY_USERNAME != '' }}
        with:
          registry: quay.io
          username: "${{ secrets.QUAY_USERNAME }}"
          password: "${{ secrets.QUAY_TOKEN }}"

      - name: Install Cosign
        if: ${{ ! inputs.dry-run && env.COSIGN_PRIVATE_KEY != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and publish images
        shell: bash
        env:
          COSIGN_PASSWORD: "${{ secrets.COSIGN_PASSWORD }}"
          IMAGES: "${{ inputs.images }}"
          DRY_RUN: "${{ inputs.dry-run }}"
        run: |
          #!/bin/bash

          set -eo pipefail

          exit_error() {
              printf 'Error: %s\n' "$*" >&2
              exit 1
          }

          parse_image() {
              image="${1}"

              declare -g name="" requested_tags="" context="." containerfile="" build_args=""

              IFS="," read -r -a args <<< "${image}"
              for arg in "${args[@]}"; do
                  key="${arg%%=*}"
                  value="${arg#*=}"

                  case "${key}" in
                      name)
                          name="${value}"
                          ;;
                      tags)
                          requested_tags="${value}"
                          ;;
                      context)
                          context="${value}"
                          ;;
                      containerfile)
                          containerfile="${value}"
                          ;;
                      buildargs)
                          build_args="${value}"
                          ;;
                      *)
                          exit_error "Unknown key: ${key}"
                          ;;
                  esac
              done

              if [[ -z "${name}" ]]; then
                  exit_error "Name is required"
              fi

              if [[ -z "${requested_tags}" ]]; then
                  exit_error "At least one tag is required"
              fi
          }

          calculate_tags() {
              declare -g tags=()

              for tag in $requested_tags; do
                  for registry in "${registries[@]}"; do
                      tags+=("${registry}/${name}:${tag}")
                  done
              done
          }

          build_image() {
              local build_tag="" extra_args=()

              if [[ -n "${containerfile}" ]]; then
                  extra_args+=("--file" "${containerfile}")
              fi

              for arg in $build_args; do
                  extra_args+=("--build-arg" "${arg}")
              done

              for tag in "${tags[@]}"; do
                  if [[ -z "${build_tag}" ]]; then
                      build_tag="${tag}"
                      echo "Building ${name} as ${tag}"
                      # podman resolves build args with no value from the environment.
                      # To protect the key, explicitly set the variables to empty for podman.
                      COSIGN_PRIVATE_KEY="" COSIGN_PASSWORD="" podman build --tag "${build_tag}" "${extra_args[@]}" "${context}"
                  else
                      echo "Tagging ${name} as ${tag}"
                      podman tag "${build_tag}" "${tag}"
                  fi
                  all_tags+=("${tag}")
              done
          }

          push_images() {
              local digest_file digest

              digest_file="$(mktemp -t podman-push-XXXXXXXX.digest)"

              for tag in "${all_tags[@]}"; do
                  echo "Pushing ${tag}"
                  podman push --digestfile="${digest_file}" "${tag}"
                  digest="$(cat "${digest_file}")"
                  digests["${tag%:*}@${digest}"]=true
              done

              rm -f "${digest_file}"
          }

          sign_images() {
              for digest in "${!digests[@]}"; do
                  echo "Signing ${digest}"
                  cosign sign --key env://COSIGN_PRIVATE_KEY --recursive --yes --new-bundle-format=false --use-signing-config=false "${digest}"
              done
          }

          declare -g registries=() all_tags=()
          declare -A -g digests

          if [[ -n "${GITHUB_USERNAME}" ]]; then
              registries+=("ghcr.io/${GITHUB_USERNAME}")
          fi
          if [[ -n "${DOCKER_USERNAME}" ]]; then
              registries+=("docker.io/${DOCKER_USERNAME}")
          fi
          if [[ -n "${QUAY_USERNAME}" ]]; then
              registries+=("quay.io/${QUAY_USERNAME%+*}")
          fi

          readarray -t images <<<"${IMAGES}"

          for image in "${images[@]}"; do
              if [[ -z "${image}" ]]; then
                  continue
              fi

              parse_image "${image}"
              calculate_tags
              build_image
          done

          if [[ "${DRY_RUN}" == true ]]; then
              echo "Dry run, skipping push and sign"
              exit 0
          fi

          push_images

          if [[ -n "${COSIGN_PRIVATE_KEY}" ]]; then
              sign_images
          fi
