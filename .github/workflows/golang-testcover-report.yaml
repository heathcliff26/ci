---
name: "Golang test cover report"

on:
  workflow_call:
    inputs:
      script:
        description: The script to run, relative to project root
        type: string
        required: false
        default: hack/coverprofile.sh
      coveralls:
        description: Upload coverprofiles to coveralls.io
        type: boolean
        required: false
        default: false
      coverprofile:
        description: The file containing the coverprofile
        type: string
        required: false
        default: coverprofile.out

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache-dependency-path: go.sum

      - name: Generate reports
        run: |
          ${{ inputs.script }}

      - name: Coveralls
        if: ${{ inputs.coveralls }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: "${{ inputs.coverprofile }}"
          format: "golang"

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        with:
          ref: "gh-pages"
          path: "gh-pages"

      - name: Copy files to gh-pages
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: |
          set -e
          cp ${GITHUB_WORKSPACE}/coverprofiles/*.html ${GITHUB_WORKSPACE}/gh-pages/

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        with:
          commit_message: |
            Updated go coverprofiles

            Commit: ${{ github.sha }}
          repository: "./gh-pages"
          skip_dirty_check: false
          skip_fetch: true
          skip_checkout: true

