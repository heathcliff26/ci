---
name: Push packages to Gemfury

on:
  workflow_call:
    inputs:
      pattern:
        description: "Bash glob pattern to match files to upload"
        type: string
        required: false
        default: "{*.rpm,*.apk,*.deb}"
      artifacts:
        description: "Artifacts to download."
        type: string
        required: false
        default: "*"

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          pattern: "${{ inputs.artifacts }}"
          merge-multiple: true

      - name: Push packages to Gemfury
        run: |
          #!/bin/bash

          set -e

          cd packages

          for file in ${{ inputs.pattern }}; do
              if [ ! -f "$file" ]; then
                  continue
              fi
              echo "Uploading $file"
              curl -F package=@"$file" https://${{ secrets.GEMFURY_TOKEN }}@push.fury.io/${{ secrets.GEMFURY_USERNAME }}/
          done
