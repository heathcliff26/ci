---
name: "Run Script"

on:
  workflow_call:
    inputs:
      cmd:
        description: The test command to run
        type: string
        required: true
      coverprofile:
        description: The file containing the coverprofile, will upload to coveralls.io when set
        type: string
        required: false
        default: ""
      artifact:
        description: Artifact(s) to upload
        type: string
        required: false
        default: ""
      artifact-name:
        description: The name under which the artifact will be uploaded
        type: string
        required: false
        default: ""
      architecture:
        description: The architecture to use for the runner
        type: string
        required: false
        default: "amd64"
      additional-packages:
        description: Additional packages to install
        type: string
        required: false
        default: ""
      cache:
        description: Persist cache between runs
        type: boolean
        required: false
        default: false
      cache-prefix:
        description: Prefix for the cache key
        type: string
        required: false
        default: "cargo"

jobs:
  run-script:
    runs-on: "${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install additional dependencies
        if: ${{ inputs.additional-packages != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.additional-packages }}
        shell: bash

      - name: Cache rust
        if: ${{ inputs.cache && hashFiles('Cargo.lock') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ inputs.cache-prefix }}-${{ inputs.architecture }}-${{ hashFiles('Cargo.lock') }}

      - name: Run script
        run: ${{ inputs.cmd }}
        shell: bash

      - name: Coveralls
        if: ${{ inputs.coverprofile != '' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: "${{ inputs.coverprofile }}"
          format: "golang"

      - name: Upload Artifact
        if: ${{ inputs.artifact != '' && inputs.artifact-name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "${{ inputs.artifact-name }}"
          path: "${{ inputs.artifact }}"
          retention-days: 14
          if-no-files-found: error
