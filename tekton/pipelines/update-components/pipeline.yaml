---
# yaml-language-server: $schema=https://kubernetes-schemas.heathcliff.eu/tekton.dev/pipeline_v1.json
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: update-components
  namespace: tekton-ci
spec:
  description: |
    Run make update and create a Pull Request
  params:
    - name: repo
      type: string
      description: The github repository to update.
  workspaces:
    - name: repo
      description: Workspace for cloning the repository into
  tasks:
    - name: token
      retries: 0
      taskRef:
        name: token
    - name: clone
      retries: 0
      taskRef:
        name: clone
      params:
        - name: token
          value: $(tasks.token.results.token)
        - name: repo
          value: $(params.repo)
      workspaces:
        - name: repo
    - name: update-components
      retries: 0
      runAfter:
        - clone
      workspaces:
        - name: repo
      taskSpec:
        workspaces:
        - name: repo
          description: Repository for running the command
          mountPath: /home/runner/repo
        steps:
          - name: update
            image: ghcr.io/heathcliff26/runner:13.6.202608311928@sha256:2e80b712ea4c37e97aad04398fc8a266670adf6b73483d39ebb8c14e318e78c1
            timeout: 15m
            env:
              - name: REPO_DIR
                value: $(workspaces.repo.path)
            script: |
              #!/bin/sh

              set -e

              cd "${REPO_DIR}"
              make update
    - name: pr
      retries: 0
      runAfter:
        - update-components
      taskRef:
        name: pr
      params:
        - name: token
          value: $(tasks.token.results.token)
        - name: branch
          value: update-components
        - name: title
          value: "Update components to latest version"
        - name: body
          value: "Created via `make update`"
        - name: labels
          value: update
      workspaces:
        - name: repo
  finally:
    - name: failure-notification
      when:
        - input: $(tasks.status)
          operator: in
          values: ["Failed", "None"]
      taskRef:
        name: failure-notification
      params:
        - name: repo
          value: $(params.repo)
        - name: pipeline
          value: $(context.pipeline.name)
        - name: pipelinerun
          value: $(context.pipelineRun.name)
