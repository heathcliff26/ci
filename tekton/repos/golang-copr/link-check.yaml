---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: golang-copr-link-check
  namespace: tekton-ci
spec:
  schedule: "21 0 * * 0"
  timeZone: "Europe/Berlin"
  jobTemplate:
    spec:
      # Delete the job after 24h to free up resources.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          containers:
          - name: curl
            image: quay.io/curl/curl:8.22.0
            args: ["curl", "-X", "POST", "--data", '{"pipeline": "link-check", "repo": "golang-copr"}', "el-cron.tekton-ci.svc.cluster.local:8080"]
          restartPolicy: Never
