---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: golang-copr-update-components
  namespace: tekton-ci
spec:
  schedule: "30 5 * * 6"
  timeZone: "Europe/Berlin"
  jobTemplate:
    spec:
      # Delete the job after 24h to free up resources.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          containers:
          - name: curl
            image: quay.io/curl/curl:8.22.0
            args: ["curl", "-X", "POST", "--data", '{"pipeline": "update-components", "repo": "golang-copr"}', "el-cron.tekton-ci.svc.cluster.local:8080"]
          restartPolicy: Never
